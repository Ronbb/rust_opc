name: Release crates

on:
  push:
    tags:
      - "v*"

# crates.io Trusted Publishing uses GitHub's OIDC token to mint a short-lived
# registry token. Configure this workflow as a trusted publisher for each
# crate in the crates.io settings before creating a release tag.
permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  publish:
    name: Publish crates
    runs-on: windows-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Publish dependencies first. opc_classic_abi is intentionally
          # private, so the ABI-dependent DA/AE/HDA crates are not included.
          $packages = @(
            "opc_classic_types",
            "opc_classic_utils",
            "opc_comn_bindings"
          )

          $arguments = @("publish", "--locked")
          foreach ($package in $packages) {
            $arguments += @("--package", $package)
          }

          & cargo @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing crates failed with exit code $LASTEXITCODE"
          }
